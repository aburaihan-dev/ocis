name: Build & Publish oCIS (HEIC/HEIF patched)

on:
  push:
    branches: [heic-support]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ocis

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout patch repo
        uses: actions/checkout@v4
        with:
          path: patch

      - name: Clone upstream oCIS v8.0.3
        run: |
          git clone --depth=1 --branch v8.0.3 \
            https://github.com/owncloud/ocis.git upstream

      - name: Apply HEIC/HEIF patches
        run: |
          cp patch/services/thumbnails/pkg/thumbnail/thumbnail.go \
             upstream/services/thumbnails/pkg/thumbnail/thumbnail.go
          cp patch/Dockerfile upstream/Dockerfile

      - name: Set up QEMU (ARM64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=8.0.3-heic
            type=raw,value=latest-heic

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: upstream
          file: upstream/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
